# Deploy every Supabase Edge Function in supabase/functions to the Jarvis
# project, exactly as committed. Runs on every push to main that touches the
# functions, and by hand (Actions > Deploy edge functions > Run workflow).
#
# Needs one repository secret: SUPABASE_ACCESS_TOKEN (Supabase dashboard >
# Account > Access Tokens). Settings > Secrets and variables > Actions.
# verify_jwt per function comes from supabase/config.toml (all off: each
# function checks its own caller).
name: Deploy edge functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch:

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: mcrpchqkconbesgborhj
    steps:
      - uses: actions/checkout@v4

      - name: Token present
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add the SUPABASE_ACCESS_TOKEN repository secret (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # On failure, the last lines also go out as annotations, so the error
      # can be read from the check run without downloading logs.
      - name: Deploy all functions
        run: |
          set -o pipefail
          if ! supabase functions deploy --project-ref "$PROJECT_REF" --yes 2>&1 | tee deploy.log; then
            tail -n 10 deploy.log | while IFS= read -r line; do echo "::error::${line}"; done
            exit 1
          fi

      - name: List functions
        run: supabase functions list --project-ref "$PROJECT_REF"
